# Prism golangci-lint configuration
# golangci-lint v2 schema (v2.5+). Validate with: golangci-lint config verify
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # Start from the standard set (errcheck, govet, ineffassign, staticcheck,
  # unused) and add the extras below.
  default: standard
  enable:
    - bodyclose
    - cyclop # cyclomatic complexity
    - gocognit # cognitive complexity
    - goconst
    - gocritic
    - gosec
    - misspell
    - nakedret
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace

  settings:
    cyclop:
      max-complexity: 15
    gocognit:
      min-complexity: 20
    goconst:
      min-len: 3
      min-occurrences: 3
    gosec:
      excludes: []
    revive:
      confidence: 0.8

  exclusions:
    # Directories not linted (moved from run.skip-dirs).
    paths:
      - vendor
      - node_modules
      - .git
      - cmd/prism-gui/frontend
    rules:
      # Relax noisy linters in test files.
      - path: _test\.go
        linters:
          - cyclop
          - errcheck
          - gosec
          - goconst
      # Allow complex main functions.
      - path: cmd/.*/main\.go
        linters:
          - gocognit
          - cyclop

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
