# Prism golangci-lint configuration
# golangci-lint v2 schema (v2.5+). Validate with: golangci-lint config verify
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # Start from the standard set (errcheck, govet, ineffassign, staticcheck,
  # unused) and add the extras below.
  default: standard
  # The gate keeps the linters that find bugs (errcheck, gosec, bodyclose,
  # staticcheck, gocritic's diagnostic checks) strict, and holds style and
  # complexity to limits the codebase can meet. goconst (1,400 repeated-literal
  # hits), unparam and prealloc were dropped as low-value noise for this repo.
  enable:
    - bodyclose
    - cyclop # cyclomatic complexity
    - gocognit # cognitive complexity
    - gocritic
    - gosec
    - misspell
    - nakedret
    - revive
    - unconvert
    - whitespace

  settings:
    # Complexity ceilings catch new outliers without forcing rewrites of the
    # existing large functions (gocognit median 24, max 127 when last measured).
    cyclop:
      max-complexity: 30
    gocognit:
      min-complexity: 60
    errcheck:
      # Errors that carry no actionable signal here: writes to the terminal and
      # closing an HTTP response body that was only read. Closing files that
      # were written is still checked.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush
        - (io.ReadCloser).Close
    gocritic:
      # Diagnostic checks only (likely bugs); style checks such as ifElseChain
      # and assignOp are left to review.
      disabled-tags:
        - style
        - opinionated
        - experimental
        - performance
    staticcheck:
      # golangci's defaults, minus the quickfix (QF) refactoring suggestions.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF*
    gosec:
      excludes: []
    revive:
      confidence: 0.8

  exclusions:
    # Directories not linted (moved from run.skip-dirs).
    paths:
      - vendor
      - node_modules
      - .git
      - cmd/prism-gui/frontend
    rules:
      # Relax noisy linters in test files.
      - path: _test\.go
        linters:
          - cyclop
          - errcheck
          - gosec
          - goconst
      # Allow complex main functions.
      - path: cmd/.*/main\.go
        linters:
          - gocognit
          - cyclop

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
