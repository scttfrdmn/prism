name: macOS DMG Installer

on:
  push:
    tags:
      - 'v*'
  # Pull requests that touch the installer or the GUI build it too (kept as an artifact,
  # not published), so a broken installer fails review instead of a release (#754).
  pull_request:
    paths:
      - 'scripts/build-dmg.sh'
      - 'scripts/build-msi.ps1'
      - 'packaging/**'
      - 'cmd/prism-gui/**'
      - '.github/workflows/release-*.yml'
  workflow_dispatch:

jobs:
  build-dmg:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true

      # The GUI (Wails v3) needs Node for its frontend and the matching wails3 CLI.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/prism-gui/frontend/package-lock.json

      - name: Install wails3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Xcode Command Line Tools
        run: xcode-select --install || true

      # Full build, GUI included: build-dmg.sh fails if bin/prism-gui is missing (#754).
      - name: Build DMG
        run: bash scripts/build-dmg.sh

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/dmg/Prism-*.dmg
          fail_on_unmatched_files: true

      - name: Keep DMG as a build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: prism-dmg
          path: dist/dmg/Prism-*.dmg
          if-no-files-found: error
