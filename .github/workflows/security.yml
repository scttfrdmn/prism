name: Security Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # Weekly Monday 8am UTC — catches new CVEs

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Vulnerability & SAST Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --- Go vulnerability check ---
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        id: govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # --- npm dependency audit ---
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/prism-gui/frontend/package-lock.json

      - name: npm audit
        id: npm_audit
        continue-on-error: true
        working-directory: cmd/prism-gui/frontend
        run: npm audit

      # --- Trivy filesystem scan (Go + npm deps + secrets) ---
      - name: Trivy filesystem scan
        id: trivy_fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

      # --- Trivy IaC scan (Dockerfile misconfigurations) ---
      - name: Trivy IaC scan
        id: trivy_iac
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

      # --- Semgrep SAST ---
      # Use curated Go ruleset rather than 'auto' (all 1000+ rules) to avoid
      # false positives on legitimate patterns (text/template, exec.Command with
      # validated input, MD5 for checksums, etc).
      - name: Semgrep
        id: semgrep
        continue-on-error: true
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/golang
            p/secrets

      # Every scanner above runs even when an earlier one fails (continue-on-error),
      # so one red scanner never hides the others' results (#698). This step fails
      # the job if any of them failed.
      - name: Fail if any scanner failed
        if: always()
        env:
          GOVULNCHECK: ${{ steps.govulncheck.outcome }}
          NPM_AUDIT: ${{ steps.npm_audit.outcome }}
          TRIVY_FS: ${{ steps.trivy_fs.outcome }}
          TRIVY_IAC: ${{ steps.trivy_iac.outcome }}
          SEMGREP: ${{ steps.semgrep.outcome }}
        run: |
          failed=0
          for v in GOVULNCHECK NPM_AUDIT TRIVY_FS TRIVY_IAC SEMGREP; do
            echo "$v: ${!v}"
            [ "${!v}" = "success" ] || failed=1
          done
          exit $failed
