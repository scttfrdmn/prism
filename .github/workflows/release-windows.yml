name: Windows MSI Installer

on:
  push:
    tags:
      - 'v*'
  # Pull requests that touch the installer or the GUI build it too (kept as an artifact,
  # not published), so a broken installer fails review instead of a release (#754).
  pull_request:
    paths:
      - 'scripts/build-dmg.sh'
      - 'scripts/build-msi.ps1'
      - 'packaging/**'
      - 'cmd/prism-gui/**'
      - '.github/workflows/release-*.yml'
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: true

      # build-msi.ps1 builds the GUI frontend (Wails v3) before the GUI binary.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/prism-gui/frontend/package-lock.json

      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Version from tag (0.0.0 for manual runs)
        id: version
        shell: pwsh
        run: |
          $ver = "0.0.0"
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) { $ver = "${{ github.ref_name }}".TrimStart('v') }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Build MSI
        shell: pwsh
        run: pwsh scripts/build-msi.ps1 -Version ${{ steps.version.outputs.VERSION }}

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/windows/Prism-*.msi
          fail_on_unmatched_files: true

      - name: Keep MSI as a build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: prism-msi
          path: dist/windows/Prism-*.msi
          if-no-files-found: error
